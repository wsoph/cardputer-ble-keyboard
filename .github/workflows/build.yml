name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C++ checks
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I include test/test_keyboard.cpp src/keyboard_core.cpp src/pairing_prompt.cpp -o /tmp/cardputer-keyboard-tests
          /tmp/cardputer-keyboard-tests
  firmware:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run -e cardputer-ble-keyboard
      - name: Package clean build artifacts
        run: >-
          python tools/package_firmware.py
          --build-dir .pio/build/cardputer-ble-keyboard
          --framework-dir "$HOME/.platformio/packages/framework-arduinoespressif32"
          --package-root release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: cardputer-ble-keyboard
          path: release-packages/
