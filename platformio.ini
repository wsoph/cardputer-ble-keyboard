[platformio]
default_envs = cardputer-ble-keyboard

[env:cardputer-ble-keyboard]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_M5STACK_CARDPUTER
    ; BLE library verbose logs contain report bytes and pairing PINs; keep input private.
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#2d4fa6646e4e5b47e0af96214b003aa7b15b8d81
    https://github.com/m5stack/M5Unified.git#e126f900d74fc4f759a1def65ebd84a4c6451b76
    m5stack/M5GFX@0.2.32
    z3t0/IRremote@4.4.1
monitor_speed = 115200
